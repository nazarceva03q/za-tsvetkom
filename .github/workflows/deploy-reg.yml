name: Deploy website to REG.RU
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check files without connecting to hosting
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: website-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public upload list
        run: python3 scripts/publish-storefront.py --dry-run
      - name: Publish public storefront
        if: >-
          github.ref == 'refs/heads/main' && vars.SITE_DEPLOY_READY == 'true' &&
          (github.event_name == 'push' || inputs.dry_run == false)
        env:
          SITE_DEPLOY_READY: ${{ vars.SITE_DEPLOY_READY }}
          FTP_WEB_ROOT: ${{ vars.FTP_WEB_ROOT }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/publish-storefront.py --apply
