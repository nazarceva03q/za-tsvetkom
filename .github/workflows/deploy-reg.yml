name: Deploy website to REG.RU
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check files without connecting to hosting
        type: boolean
        default: true
        required: true
      legal_only:
        description: Publish only legal pages and their storefront links; keep intake disabled
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: website-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public upload list
        run: python3 scripts/publish-storefront.py --dry-run
      - name: Publish public storefront
        if: >-
          github.ref == 'refs/heads/main' && vars.SITE_DEPLOY_READY == 'true' && inputs.legal_only != true &&
          (github.event_name == 'push' || inputs.dry_run == false)
        env:
          SITE_DEPLOY_READY: ${{ vars.SITE_DEPLOY_READY }}
          FTP_WEB_ROOT: ${{ vars.FTP_WEB_ROOT }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/publish-storefront.py --apply
  legal-documents:
    if: github.event_name == 'workflow_dispatch' && inputs.legal_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate legal publication list
        run: python3 scripts/publish-legal.py --dry-run
      - name: Publish legal documents only
        if: inputs.dry_run == false
        env:
          LEGAL_DEPLOY_APPROVED: 'true'
          FTP_WEB_ROOT: ${{ vars.FTP_WEB_ROOT }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/publish-legal.py --apply
      - name: Preserve previous public pages and publication result
        if: always() && inputs.dry_run == false
        uses: actions/upload-artifact@v4
        with:
          name: legal-publication-backup
          path: .release-backups/
          include-hidden-files: true
          retention-days: 7
