name: REG.RU FTPS connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check secure FTPS connection
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from ftplib import FTP_TLS

          ftp = FTP_TLS(timeout=20)
          ftp.connect(os.environ["FTP_HOST"], 21)
          ftp.login(
              os.environ["FTP_USERNAME"],
              os.environ["FTP_PASSWORD"]
          )
          ftp.prot_p()
          print("Secure FTPS connection successful")
          print("Remote directory:", ftp.pwd())
          ftp.quit()
          PY
